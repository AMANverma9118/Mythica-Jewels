<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MYTHICA JEWELS - Exquisite handcrafted jewelry for the discerning collector" />
    <title>MYTHICA JEWELS - Timeless Elegance</title>

    <!-- Apply stored theme before paint (pairs with ThemeContext + Tailwind class dark:) -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('mj-theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) { /* ignore */ }
        })();
    </script>

    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google reCAPTCHA v3 -->
    <script
        src="https://www.google.com/recaptcha/api.js?render=6LfEdzUsAAAAADYLbog-_DVd_Clpu7mj3Lldy9oq"
        async
        defer
    ></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #b45309;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #92400e;
        }

        .dark ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #d97706;
        }

        .dark ::-webkit-scrollbar-thumb:hover {
            background: #f59e0b;
        }

        html {
            scroll-behavior: smooth;
        }

        .grecaptcha-badge {
            visibility: hidden;
        }
    </style>
</head>

<body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
